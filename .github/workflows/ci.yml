name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # One step on purpose: `npm run verify` is the same gate maintainers run
      # locally (lint, format, tests, build, dependency audits, type tests,
      # consumer smoke test, docs build), so CI can never drift from the
      # documented commands.
      - name: Verify (lint, format, tests, build, audits, docs build)
        run: npm run verify

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Library browser tests (real layout and accessibility)
        run: npm run test:browser

      # Builds the documentation site and drives it as a static GitHub Pages
      # deployment: playground, gallery, customiser, search, 404, axe.
      - name: Documentation site browser tests
        run: npm run test:browser:docs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/core/playwright-report/
            packages/core/test-results/
          retention-days: 7
